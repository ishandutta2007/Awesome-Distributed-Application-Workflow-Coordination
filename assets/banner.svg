<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="pinkOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 42px; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 500; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #38bdf8; }
    .pulse-line { stroke-dasharray: 8, 8; animation: dash 30s linear infinite; }
    .pulse-node { animation: pulse 3s ease-in-out infinite alternate; }
    @keyframes dash { to { stroke-dashoffset: -1000; } }
    @keyframes pulse { from { opacity: 0.4; transform: scale(0.98); } to { opacity: 0.9; transform: scale(1.02); } }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGradient)" />

  <!-- Background Architectural Grid Lines (Low Opacity - Behind Text) -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Animated Workflow Connection Lines (Subtle/Low Opacity Background Flows) -->
  <g stroke="url(#cyanPurple)" stroke-width="2" stroke-opacity="0.25" fill="none">
    <path class="pulse-line" d="M 100,80 Q 350,30 600,80 T 1100,80" />
    <path class="pulse-line" d="M 50,320 Q 400,370 750,320 T 1150,320" />
    <path class="pulse-line" d="M 150,200 C 400,50 800,350 1050,200" />
  </g>

  <!-- Decorative Nodes in Corners & Edges (Durable Execution & State Machine Aesthetics) -->
  <g filter="url(#glow)">
    <!-- Top Right Node Group -->
    <circle cx="1050" cy="90" r="8" fill="#06b6d4" />
    <circle cx="1050" cy="90" r="18" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5" />
    <rect x="1110" y="75" width="50" height="30" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="1135" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#38bdf8">SAGA</text>
    <line x1="1058" y1="90" x2="1110" y2="90" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Bottom Left Node Group -->
    <circle cx="120" cy="310" r="8" fill="#a855f7" />
    <circle cx="120" cy="310" r="18" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5" />
    <rect x="170" y="295" width="64" height="30" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text x="202" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c084fc">STATE</text>
    <line x1="128" y1="310" x2="170" y2="310" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3,3" />
  </g>

  <!-- Main Central Card Background (Semi-Transparent Solid Backdrop ensuring text high readability) -->
  <rect x="80" y="80" width="1040" height="240" rx="20" fill="#0f172a" fill-opacity="0.85" stroke="url(#cyanPurple)" stroke-width="2" filter="url(#glow)" />

  <!-- Badge Pill Above Title -->
  <rect x="420" y="110" width="360" height="32" rx="16" fill="#1e293b" stroke="#06b6d4" stroke-width="1" />
  <text x="600" y="131" text-anchor="middle" class="badge-text">⚡ DURABLE EXECUTION &amp; ORCHESTRATION 🔄</text>

  <!-- Foreground Main Title & Subtitle -->
  <text x="600" y="195" text-anchor="middle" class="title">Awesome Distributed Workflow Coordination</text>
  <text x="600" y="240" text-anchor="middle" class="subtitle">Curated Directory of Temporal, Cadence, Step Functions, Airflow, Conductor &amp; Saga Engines</text>
  <text x="600" y="275" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#e2e8f0" font-weight="600">Enterprise Platforms • Open Source Engines • Event-Driven State Machines</text>
</svg>
